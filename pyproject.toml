[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-auditor"
version = "1.0.0"
description = "Enterprise Policy Auditor — high-precision RAG over HR/compliance PDFs (hybrid BM25+dense retrieval, cross-encoder reranking, cited generation, RAGAS-evaluated)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
