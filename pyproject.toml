[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-auditor"
version = "1.0.0"
description = "Policy Auditor demo — hybrid retrieval over fictional policy PDFs with evidence citations and RAG evaluation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
